# Gradle options only
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true

# 1.21.11 仍是混淆版本：loom-back-compat 需要显式选择 obfuscated 变体 + 显式 remap loom 版本
loomx.obfuscated=true
loomx.loom_version=1.17.20

# Mod metadata
mod.id=souloutplus
mod.name=Soul Out Plus
mod.version=0.1.0
mod.group=com.souloutplus

# Minecraft / loader / deps
# 构建：单条构建线锚定 1.21.11（loom remap），声明范围 >=1.21.9 <=1.21.11（1.21.10/1.21.9 同为混淆+intermediary 时代，
# 类结构相近）。26.1+ 是不混淆时代（Mojang 官方名、无 intermediary），同一个 jar 不可能跨两边，
# 后续用 stonecutter 双构建线出第二个 jar（源码共享 + 条件编译），不是单 jar。
minecraft_version=1.21.11
loomx_version=1.18.2
