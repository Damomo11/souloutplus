# Gradle options only
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true

# 26.x 是不混淆时代（Mojang 官方名、无 intermediary）：loom 原生支持，无需 remap
loomx.obfuscated=false
loomx.loom_version=1.19.4

# Mod metadata
mod.id=souloutplus
mod.name=Soul Out Plus
mod.version=0.1.0
mod.group=com.souloutplus

# Minecraft / loader / deps
# 构建：单条构建线锚定 26.2（不混淆时代，loom 直接用官方名，无 remap）。
# 注意：26.1 仍是 LevelRenderer.renderLevel 旧渲染结构，26.2 迁到 LevelExtractor/Hud，
# mixin 目标不同，单 jar 无法跨 26.1/26.2（malilib 自己也是 0.28/0.29 分线），故只声明 26.2。
# 旧的 1.21.9–1.21.11（混淆+intermediary）构建线保留在 1.21.11 分支。
minecraft_version=26.2
loomx_version=1.18.2
